spring.application.name=studentmanagement
server.port=8080

# EXAM 3 GRADING NOTE (Section A, Q1 - 2 marks):
# The spec asks for a database literally named "student_relations_db". This says
# "studenttt_relations_db" (typo'd, extra t's), so it is not pointing at the
# database the exam asks for.
# Also: the spec explicitly says "Do not commit a real password." Whether or not
# "notes" is your real MySQL password, committing any literal password string to
# git is exactly what the instruction is warning against - once it's in git
# history it stays there even if you change it later. The standard fix is to
# read it from an environment variable with a safe-looking placeholder default,
# e.g. spring.datasource.password=${DB_PASSWORD:changeme}, and keep the real
# value in a local, gitignored file (e.g. application-local.properties) or your
# shell environment.
spring.datasource.url=jdbc:mysql://localhost:3306/studenttt_relations_db
spring.datasource.username=root
spring.datasource.password=notes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
